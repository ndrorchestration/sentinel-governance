# Doc-Lint CI Workflow
# Purpose: enforce Markdown structural consistency on current documentation.
# Historical evidence snapshots and the legacy pattern register are retained as
# historical records and excluded from style normalization.

name: Doc Lint

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.markdownlint.yml'
      - '.markdownlint.json'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - '.markdownlint.yml'
      - '.markdownlint.json'

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.39.0

      - name: Run markdownlint
        run: |
          markdownlint \
            --config .markdownlint.yml \
            --ignore node_modules \
            --ignore CHANGELOG.md \
            --ignore docs/EVIDENCE_STATUS_2026-08-30.md \
            --ignore docs/REPOSITORY_QUALITY_BASELINE_2026-08-15.md \
            --ignore knowledge-base/PATTERNS.md \
            '**/*.md'

      - name: Report summary
        if: always()
        run: |
          echo "## Doc Lint Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Linter: markdownlint-cli 0.39.0" >> "$GITHUB_STEP_SUMMARY"
          echo "- Config: .markdownlint.yml" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: current documentation; dated evidence snapshots and legacy pattern register excluded" >> "$GITHUB_STEP_SUMMARY"
